<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPU vs GPU Benchmarks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000; --panel: #0a0a0a; --hover: #161616; --border: #2a2a2a;
  --text: #f5f5f5; --muted: #a3a3a3; --accent: #FFD60A;
  --ok: #22c55e; --bad: #ef4444; --white: #f5f5f5;
  --gpu: #c98500; --cpu: #3987e5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 15px; line-height: 1.55; display: flex; min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono, .num { font-family: 'JetBrains Mono', monospace; }

/* sidebar */
nav { width: 280px; flex-shrink: 0; border-right: 1px solid var(--border); padding: 28px 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { font-weight: 700; font-size: 18px; letter-spacing: .2px; }
.brand span { color: var(--accent); }
.tagline { color: var(--muted); font-size: 12px; margin: 4px 0 26px; }
.nav-h { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; margin: 22px 0 8px; }
.nav-sub { color: var(--muted); font-size: 11px; letter-spacing: 1px; margin: 12px 0 4px 2px; }
.nav-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; color: var(--text); cursor: pointer; border-left: 2px solid transparent; font-size: 14px; }
.nav-item:hover { background: var(--hover); text-decoration: none; }
.nav-item.active { border-left-color: var(--accent); background: var(--hover); color: var(--accent); }
.nav-item.child { padding-left: 24px; font-size: 13px; color: var(--muted); }
.nav-item.child.active { color: var(--accent); }
.tag { font-size: 10px; letter-spacing: .5px; padding: 1px 6px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; border-radius: 2px; }
.tag.final { border-color: var(--ok); color: var(--ok); }

/* main */
main { flex: 1; min-width: 0; padding: 40px 48px 80px; max-width: 1400px; }
h1 { font-size: 28px; font-weight: 700; padding-bottom: 10px; border-bottom: 2px solid var(--accent); display: inline-block; margin-bottom: 8px; }
.lead { color: var(--muted); margin-bottom: 28px; max-width: 920px; }
h2 { font-size: 18px; margin: 34px 0 12px; }
h3 { font-size: 15px; margin-bottom: 8px; }
.crumb { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 30px; }
.card { background: var(--panel); border: 1px solid var(--border); padding: 18px 20px; border-radius: 2px; }
.card .label { color: var(--muted); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
.card .value { color: var(--accent); font-size: 34px; font-weight: 700; font-family: 'JetBrains Mono', monospace; margin: 4px 0; }
.card .sub { color: var(--muted); font-size: 13px; }
.box { background: var(--panel); border: 1px solid var(--border); padding: 20px 24px; margin-bottom: 26px; border-radius: 2px; }
.box .row { display: grid; grid-template-columns: 170px 1fr; gap: 14px; padding: 6px 0; border-top: 1px solid var(--border); }
.box .row:first-of-type { border-top: none; }
.box .k { color: var(--muted); font-size: 13px; }
.box .v { font-size: 14px; }
.box .v.hl { color: var(--accent); }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }

/* progress table */
.legend { display: flex; flex-wrap: wrap; gap: 22px; margin: 4px 0 14px; color: var(--muted); font-size: 13px; }
.legend span b { margin-right: 6px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left; }
th { color: var(--muted); font-size: 12px; font-weight: 600; background: var(--panel); position: sticky; top: 0; }
th .node { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
tr.group td { color: var(--accent); font-weight: 600; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; background: var(--bg); padding-top: 16px; }
td.c { text-align: center; white-space: nowrap; cursor: default; }
.s-final { color: var(--ok); font-weight: 700; font-size: 17px; }
.s-earlier { color: var(--white); font-weight: 700; font-size: 17px; }
.s-bad { color: var(--bad); font-size: 11px; font-weight: 700; letter-spacing: .5px; }
.s-todo { color: var(--white); font-size: 11px; letter-spacing: .5px; opacity: .85; }
th.side { text-align: center; color: var(--text); border-bottom: 1px solid var(--accent); }
td.num, th.num { text-align: right; font-family: 'JetBrains Mono', monospace; }

/* plots */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.plot { background: var(--panel); border: 1px solid var(--border); padding: 14px; border-radius: 2px; }
.plot img { width: 100%; display: block; cursor: zoom-in; }
.plot .cap { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
.plot.wide { grid-column: 1 / -1; }
.wcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.wcard { background: var(--panel); border: 1px solid var(--border); padding: 14px 16px; cursor: pointer; border-radius: 2px; }
.wcard:hover { border-color: var(--accent); }
.wcard .id { color: var(--muted); font-size: 11px; font-family: 'JetBrains Mono', monospace; }
.wcard .nm { font-weight: 600; margin: 2px 0 6px; }
.wcard .kv { color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 14px; }
#modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 50; align-items: center; justify-content: center; cursor: zoom-out; }
#modal img { max-width: 94vw; max-height: 92vh; }

/* compare */
.controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; margin-bottom: 18px; }
.controls label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; letter-spacing: .5px; }
select { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 8px 10px; font: inherit; font-size: 14px; min-width: 240px; border-radius: 2px; }
select:focus { outline: 1px solid var(--accent); }
.explain ol { padding-left: 20px; }
.explain li { margin: 3px 0; font-size: 14px; }
.chart { background: var(--panel); border: 1px solid var(--border); padding: 16px; margin-bottom: 16px; border-radius: 2px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart svg text { fill: var(--text); font-family: 'Inter', sans-serif; font-size: 12px; }
.chart svg .muted { fill: var(--muted); }
#tip { position: fixed; pointer-events: none; background: #111; border: 1px solid var(--accent); padding: 8px 10px; font-size: 12.5px; display: none; z-index: 60; max-width: 340px; }
.notes { color: var(--muted); font-size: 13px; }
.notes li { margin-left: 18px; }

/* library */
td.lib { cursor: pointer; }
td.lib:hover, td.lib.open { background: var(--hover); }
td.lib .w { color: var(--accent); font-weight: 600; }
td.lib .o { color: var(--muted); font-size: 12.5px; }
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 6px 22px; font-size: 13.5px; }
.gloss b { color: var(--text); }
.gloss span { color: var(--muted); }
button.lnk { background: none; border: 1px solid var(--border); color: var(--accent); padding: 5px 10px; cursor: pointer; font: inherit; font-size: 13px; margin-top: 10px; border-radius: 2px; }

/* todo */
.todo-g { margin-bottom: 22px; }
.todo-g li { list-style: none; padding: 9px 0 9px 26px; border-bottom: 1px solid var(--border); position: relative; }
.todo-g li::before { content: ""; position: absolute; left: 2px; top: 15px; width: 10px; height: 10px; border: 1px solid var(--accent); }

@media (max-width: 900px) {
  body { flex-direction: column; }
  nav { width: 100%; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--border); }
  main { padding: 24px 16px 60px; }
  .grid { grid-template-columns: 1fr; }
  .box .row { grid-template-columns: 1fr; gap: 2px; }
}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="main"></main>
<div id="modal" onclick="this.style.display='none'"><img id="modal-img" alt=""></div>
<div id="tip"></div>
<script>
// Injected by analysis/build_dashboard.py
const pages = {};
const navData = {};
const progressData = {};
const compareData = {};
const libraryReport = {};
const todoData = {};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = v => v == null || !isFinite(v) ? '—' : (Math.abs(v) >= 100 ? Math.round(v).toLocaleString('en-US') : Number(v.toPrecision(3)).toString());
const fmtU = (v, u) => { if (v == null || !isFinite(v)) return '—';
  if (u === 'GFLOP/s' && v >= 1000) return (v / 1000).toLocaleString('en-US', {maximumFractionDigits: 1}) + ' TFLOP/s';
  return fmt(v) + ' ' + u; };
const times = r => r >= 1 ? `${r >= 10 ? r.toFixed(0) : r.toFixed(1)}×` : `${(1 / r) >= 10 ? (1 / r).toFixed(0) : (1 / r).toFixed(1)}×`;
const LIB = { torch: 'PyTorch', cudagraph: 'PyTorch + CUDA graph', native: 'our own kernel', graph: 'CUDA graph launch',
  coop: 'cooperative launch', fast: 'our own kernel, fast exp', histc: 'PyTorch histc', bincount: 'PyTorch bincount',
  openblas: 'OpenBLAS', blis: 'BLIS', opencv: 'OpenCV', openssl: 'OpenSSL', gnu_parallel: 'GNU parallel sort', tbb: 'Intel oneTBB' };
const GLOSS = {
  torch: ['PyTorch', 'open source', 'General-purpose maths library for AI; on processors it calls Intel\'s math library (oneMKL, closed source but free) and oneDNN, on GPUs NVIDIA\'s cuBLAS/cuDNN.'],
  openblas: ['OpenBLAS', 'open source', 'Widely used library of hand-tuned matrix routines for processors.'],
  blis: ['BLIS', 'open source', 'Matrix-routine framework from the University of Texas; the basis of AMD\'s own math library.'],
  native: ['our own kernel', 'this project', 'Code we wrote for this workload and compiled with the benchmark.'],
  opencv: ['OpenCV', 'open source', 'The standard image-processing library.'],
  gnu_parallel: ['GNU parallel sort', 'open source', 'Multi-core sort that ships with the GNU C++ compiler.'],
  tbb: ['Intel oneTBB', 'open source', 'Intel\'s library for parallel algorithms, including sort.'],
  histc: ['PyTorch histc', 'open source', 'PyTorch\'s histogram of decimal numbers.'],
  bincount: ['PyTorch bincount', 'open source', 'PyTorch\'s count of whole numbers per bin.'],
  cudagraph: ['CUDA graph', 'NVIDIA, closed source', 'Records a sequence of GPU steps once and replays it, avoiding per-step launch overhead.'],
  graph: ['CUDA graph launch', 'NVIDIA, closed source', 'Same idea: the batches are replayed as one recorded GPU program.'],
  coop: ['cooperative launch', 'NVIDIA, closed source', 'One GPU program that synchronizes the whole GPU between batches.'],
};
const libName = l => LIB[l] || l;

// ── routing ─────────────────────────────────────────────────────────────────
let route = [];
function go(h) { location.hash = h; }
window.addEventListener('hashchange', render);
function parse() { const h = decodeURIComponent(location.hash.replace(/^#/, '')); return h ? h.split('/') : ['progress']; }

let lastHash = null;
function render() {
  route = parse();
  const moved = lastHash !== location.hash; lastHash = location.hash;
  renderNav();
  const [v, a, b, c] = route;
  const m = document.getElementById('main');
  if (v === 'compare') m.innerHTML = viewCompare(a, b, c);
  else if (v === 'library') m.innerHTML = viewLibrary();
  else if (v === 'todo') m.innerHTML = viewTodo();
  else if (v === 'm' && pages[a]) m.innerHTML = b ? viewWorkload(a, b) : viewMachine(a);
  else m.innerHTML = viewProgress();
  if (v === 'compare') drawCompare();
  if (v === 'library') bindLibrary();
  if (moved) window.scrollTo(0, 0);
  document.querySelectorAll('.plot img').forEach(im => im.onclick = () => {
    document.getElementById('modal-img').src = im.src; document.getElementById('modal').style.display = 'flex'; });
}

function renderNav() {
  const [v, a, b] = route;
  const item = (h, label, active, extra = '', cls = '') =>
    `<a class="nav-item ${cls} ${active ? 'active' : ''}" href="#${h}"><span>${label}</span>${extra}</a>`;
  let h = `<div class="brand">CPU <span>vs</span> GPU</div><div class="tagline">Replicating "Debunking the 100× GPU vs CPU myth" (ISCA 2010)</div>
    <div class="nav-h">Project Status</div>
    ${item('progress', 'Project progress', v === 'progress' || !v)}
    ${item('compare', 'CPU vs GPU', v === 'compare')}
    ${item('library', 'Library analysis', v === 'library')}
    ${item('todo', 'Todo', v === 'todo')}
    <div class="nav-h">Machines</div>`;
  for (const side of ['cpu', 'gpu']) {
    h += `<div class="nav-sub">${side === 'cpu' ? 'CPUs' : 'GPUs'}</div>`;
    for (const d of (navData[side] || [])) {
      h += item(`m/${d.id}`, esc(d.name), v === 'm' && a === d.id && !b);
      if (v === 'm' && a === d.id) {
        h += item(`m/${d.id}`, 'Overview', !b, '', 'child');
        for (const w of pages[d.id].workloads) h += item(`m/${d.id}/${w.id}`, esc(w.name), b === w.id, '', 'child');
      }
    }
  }
  document.getElementById('nav').innerHTML = h;
}

// ── project progress ────────────────────────────────────────────────────────
function viewProgress() {
  const P = progressData, cols = [...P.columns.cpu, ...P.columns.gpu];
  const sym = { final: '<span class="s-final">✓</span>', earlier: '<span class="s-earlier">✓</span>',
                bad: '<span class="s-bad">TODO</span>', todo: '<span class="s-todo">TODO</span>' };
  let h = `<h1>Project progress</h1>
    <p class="lead">Sixteen workloads from the original study, each with a tuned processor (CPU) and graphics-card (GPU) version,
    measured on the core machines below. Click a machine in the sidebar for its results.</p>
    <div class="cards">${P.cards.map(c => `<div class="card"><div class="label">${esc(c.label)}</div><div class="value">${esc(c.value)}</div><div class="sub">${esc(c.sub)}</div></div>`).join('')}</div>
    <div class="legend">
      <span><b class="s-final">✓</b>measured with the final scripts</span>
      <span><b class="s-earlier">✓</b>earlier scripts, results correct</span>
      <span><b class="s-bad">TODO</b>ran, but the earlier method was wrong</span>
      <span><b class="s-todo">TODO</b>not run yet</span></div>
    <div class="tbl-wrap"><table><thead><tr><th rowspan="2">Workload</th>
      <th class="side" colspan="${P.columns.cpu.length}">Core CPUs</th><th class="side" colspan="${P.columns.gpu.length}">Core GPUs</th></tr><tr>
      ${cols.map(c => `<th style="text-align:center">${esc(c.name)}<span class="node">${esc(c.node)}</span></th>`).join('')}</tr></thead><tbody>`;
  for (const g of P.groups) {
    h += `<tr class="group"><td colspan="${cols.length + 1}">${esc(g.title)}</td></tr>`;
    for (const r of g.rows) {
      h += `<tr><td>${esc(r.name)}</td>` + cols.map(c => { const x = r.cells[c.id];
        const link = (x.s === 'final' || x.s === 'earlier') && pages[c.id] && pages[c.id].workloads.some(w => w.id === r.id);
        const s = sym[x.s];
        return `<td class="c" title="${esc(x.why)}">${link ? `<a href="#m/${c.id}/${r.id}">${s}</a>` : s}</td>`; }).join('') + '</tr>';
    }
  }
  return h + '</tbody></table></div><p class="note">Hover a cell for the reason. More machines with earlier-script data are listed in the sidebar.</p>';
}

// ── machine pages ───────────────────────────────────────────────────────────
function badge(p) { return p.category === 'final' ? '<span class="tag final">final scripts</span>' : '<span class="tag">earlier scripts</span>'; }
function plotCard(dev, f, wide) {
  return `<div class="plot${wide ? ' wide' : ''}"><h3>${esc(f.title)}</h3><img loading="lazy" src="devices/${dev}/${esc(f.file)}" alt="${esc(f.title)}"><div class="cap">${esc(f.caption)}</div></div>`;
}
function viewMachine(dev) {
  const p = pages[dev];
  let h = `<div class="crumb">${p.cls === 'cpu' ? 'CPU' : 'GPU'} · ${badge(p)}</div><h1>${esc(p.name)}</h1><p class="lead">${esc(p.spec)}</p>
    <div class="box"><h3>Machine limits</h3>${p.limits.map((l, i) => `<div class="row"><div class="k">${i < p.limits.length - 1 || !l.startsWith('Measured') ? 'Theoretical' : 'Measured'}</div><div class="v${l.startsWith('Measured') ? ' hl' : ''}">${esc(l.replace(/^Measured( by the earlier scripts)?: /, m => m.includes('earlier') ? 'By the earlier scripts: ' : ''))}</div></div>`).join('')}</div>`;
  if (p.overview) h += plotCard(dev, p.overview, true) + (p.no_limit.length ? `<p class="note">No single hardware limit (reported as throughput): ${esc(p.no_limit.join(', '))}.</p>` : '');
  h += `<h2>Workloads</h2><div class="wcards">${p.workloads.map(w => `<div class="wcard" onclick="go('m/${dev}/${w.id}')"><div class="id">${esc(w.id)}</div><div class="nm">${esc(w.name)}</div><div class="kv">${esc(w.key)}</div></div>`).join('')}</div>`;
  return h;
}
function viewWorkload(dev, wid) {
  const p = pages[dev], w = p.workloads.find(x => x.id === wid);
  if (!w) return viewMachine(dev);
  const H = w.header;
  const rows = [['Theoretical peak', H.peak], ['Measured limit', H.measured], ['Achieved', [H.achieved]], ['Why', H.why]]
    .filter(r => r[1] && r[1].length && r[1][0]);
  return `<div class="crumb"><a href="#m/${dev}">${esc(p.name)}</a> · ${badge(p)}</div><h1>${esc(w.name)}</h1><p class="lead">${esc(w.what)}</p>
    <div class="box">${rows.map(([k, v]) => `<div class="row"><div class="k">${k}</div><div class="v${k === 'Achieved' ? ' hl' : ''}">${v.map(esc).join('<br>')}</div></div>`).join('')}
    ${w.note ? `<p class="note">${esc(w.note)}</p>` : ''}</div>
    <div class="grid">${w.figures.map(f => plotCard(dev, f, false)).join('')}</div>`;
}

// ── CPU vs GPU ──────────────────────────────────────────────────────────────
const C = compareData;
const mach = id => (C.machines || []).find(m => m.id === id);
const wname = w => (C.workload_names || {})[w] || w;
function pick(pts, preferDram) {
  const pref = { fp32: 0, fp64: 1 };
  let c = pts;
  if (preferDram && c.some(p => p.dram)) c = c.filter(p => p.dram);
  return [...c].sort((a, b) => (b.sz - a.sz) || ((pref[a.prec] ?? 2) - (pref[b.prec] ?? 2)))[0];
}
const MEM = new Set(['B1', 'B2', 'B3', 'B4']);
function pair(cpu, gpu) {
  const A = C.data[cpu] || {}, B = C.data[gpu] || {}, out = [], notComp = [];
  for (const w of C.order) {
    if (!A[w] || !B[w]) continue;
    if (A[w].unit !== B[w].unit) { notComp.push(wname(w)); continue; }
    const ka = new Map(A[w].pts.map(p => [p.key, p])), kb = new Map(B[w].pts.map(p => [p.key, p]));
    const common = [...ka.keys()].filter(k => kb.has(k));
    let r;
    if (common.length) {
      const both = common.map(k => ({ ...ka.get(k), dram: ka.get(k).dram && kb.get(k).dram }));
      const p = pick(both, MEM.has(w)); const a = ka.get(p.key), b = kb.get(p.key);
      r = { w, a, b, ratio: b.v / a.v, ci: ciFor(cpu, gpu, w, p.key), fallback: false };
    } else {
      const a = bestOf(A[w].pts, MEM.has(w)), b = bestOf(B[w].pts, MEM.has(w));
      r = { w, a, b, ratio: b.v / a.v, ci: null, fallback: true };
    }
    r.unit = A[w].unit; r.earlier = mach(cpu).category === 'earlier' || mach(gpu).category === 'earlier';
    out.push(r);
  }
  return { rows: out, notComp };
}
function bestOf(pts, dram) { let c = dram && pts.some(p => p.dram) ? pts.filter(p => p.dram) : pts; return c.reduce((x, y) => y.v > x.v ? y : x); }
function ciFor(cpu, gpu, w, key) {
  const r1 = C.ratios[`${cpu}|${gpu}|${w}|${key}`]; if (r1) return [r1[1], r1[2]];
  const r2 = C.ratios[`${gpu}|${cpu}|${w}|${key}`]; if (r2) return [1 / r2[2], 1 / r2[1]];
  return null;
}
function viewCompare(cpu, gpu, wl) {
  const cpus = (C.machines || []).filter(m => m.cls === 'cpu'), gpus = (C.machines || []).filter(m => m.cls === 'gpu');
  cpu = cpus.some(m => m.id === cpu) ? cpu : (cpus.find(m => m.id === 'INTEL_C6620') || cpus[0]).id;
  gpu = gpus.some(m => m.id === gpu) ? gpu : (gpus.find(m => m.id === 'NVIDIA_V100') || gpus[0]).id;
  const P = pair(cpu, gpu);
  wl = P.rows.some(r => r.w === wl) ? wl : 'all';
  const opt = (list, sel) => list.map(m => `<option value="${m.id}" ${m.id === sel ? 'selected' : ''}>${esc(m.name)}${m.category === 'earlier' ? ' (earlier scripts)' : ''}</option>`).join('');
  return `<h1>CPU vs GPU</h1><p class="lead">Pick a processor, a graphics card and a workload to see how many times faster one is than the other.</p>
    <div class="box explain"><h3>How the comparison works</h3><ol>
      <li>Both machines ran the same workload on the same inputs. With the final scripts, every result was checked against a reference answer before it counted.</li>
      <li>Each machine uses its fastest available software on all of its processor cores, or on one graphics card.</li>
      <li>"N× faster" is the GPU result divided by the CPU result at the same problem size and number format. Final-script results are the middle value of three separate runs, shown with their 95% range.</li>
      <li>"All workloads" compares each workload at the largest size both machines ran, plus an overall average (geometric mean, so every workload counts equally).</li>
      <li>GPU time counts the computation only, not copying the data onto the card, as in the original study. Paler bars use correct results from the earlier scripts (averages, no range).</li></ol></div>
    <div class="controls">
      <label>CPU<select id="sel-cpu">${opt(cpus, cpu)}</select></label>
      <label>GPU<select id="sel-gpu">${opt(gpus, gpu)}</select></label>
      <label>Workload<select id="sel-w"><option value="all">All workloads</option>${P.rows.map(r => `<option value="${r.w}" ${r.w === wl ? 'selected' : ''}>${esc(wname(r.w))}</option>`).join('')}</select></label>
    </div><div id="cmp" data-cpu="${cpu}" data-gpu="${gpu}" data-w="${wl}"></div>`;
}
const tip = document.getElementById('tip');
function showTip(e, html) { tip.innerHTML = html; tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 14, innerWidth - 360) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; }
function hideTip() { tip.style.display = 'none'; }
function drawCompare() {
  const el = document.getElementById('cmp'); if (!el) return;
  const cpu = el.dataset.cpu, gpu = el.dataset.gpu, wl = el.dataset.w;
  ['sel-cpu', 'sel-gpu', 'sel-w'].forEach(id => document.getElementById(id).onchange = () =>
    go(`compare/${document.getElementById('sel-cpu').value}/${document.getElementById('sel-gpu').value}/${id === 'sel-w' ? document.getElementById('sel-w').value : 'all'}`));
  const P = pair(cpu, gpu), cn = mach(cpu).name, gn = mach(gpu).name;
  if (!P.rows.length) { el.innerHTML = '<p class="note">These two machines have no workload in common yet.</p>'; return; }
  if (wl === 'all') return drawAll(el, P, cn, gn, cpu, gpu);
  drawOne(el, P.rows.find(r => r.w === wl), cn, gn, cpu, gpu);
}
function logScale(lo, hi, a, b) { const L = Math.log10(lo), H = Math.log10(hi); return v => a + (Math.log10(v) - L) / (H - L) * (b - a); }
function drawAll(el, P, cn, gn, cpu, gpu) {
  const rows = P.rows, gm = Math.exp(rows.reduce((s, r) => s + Math.log(r.ratio), 0) / rows.length);
  const all = [...rows.map(r => ({ ...r, label: wname(r.w) })), { label: 'Overall (geometric mean)', ratio: gm, gm: true, earlier: rows.some(r => r.earlier) }];
  const W = 1000, rowH = 30, top = 34, left = 250, right = 120, H = top + all.length * rowH + 40;
  const vals = all.flatMap(r => [r.ratio, ...(r.ci || [])]);
  const lo = Math.min(0.5, ...vals) / 1.3, hi = Math.max(2, ...vals) * 1.3, x = logScale(lo, hi, left, W - right);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Times faster per workload">`;
  const ticks = [0.01, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000].filter(t => t >= lo && t <= hi);
  ticks.forEach(t => s += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 6}" y2="${H - 34}" stroke="#262626"/><text class="muted" x="${x(t)}" y="${H - 16}" text-anchor="middle">${t < 1 ? `CPU ${fmt(1 / t)}×` : (t === 1 ? 'equal' : `GPU ${t}×`)}</text>`);
  s += `<line x1="${x(1)}" x2="${x(1)}" y1="${top - 10}" y2="${H - 34}" stroke="#f5f5f5" stroke-dasharray="4 3"/>`;
  all.forEach((r, i) => {
    const y = top + i * rowH, gpuF = r.ratio >= 1, c = gpuF ? 'var(--gpu)' : 'var(--cpu)', x0 = x(1), x1 = x(r.ratio);
    const op = r.earlier && !r.gm ? 0.5 : 1;
    if (r.gm) s += `<line x1="0" x2="${W}" y1="${y - 4}" y2="${y - 4}" stroke="#2a2a2a"/>`;
    s += `<text x="${left - 12}" y="${y + 16}" text-anchor="end" ${r.gm ? 'font-weight="700"' : ''}>${esc(r.label)}</text>`;
    s += `<rect x="${Math.min(x0, x1)}" y="${y + 5}" width="${Math.max(2, Math.abs(x1 - x0))}" height="${rowH - 10}" fill="${c}" opacity="${op}" rx="2" data-i="${i}" class="bar"/>`;
    if (r.ci) s += `<line x1="${x(r.ci[0])}" x2="${x(r.ci[1])}" y1="${y + rowH / 2}" y2="${y + rowH / 2}" stroke="#f5f5f5" stroke-width="1.5"/>`;
    s += `<text x="${gpuF ? Math.max(x1, x0) + 8 : Math.min(x1, x0) - 8}" y="${y + 19}" text-anchor="${gpuF ? 'start' : 'end'}" font-weight="600">${gpuF ? 'GPU ' : 'CPU '}${times(r.ratio)}${r.fallback ? '*' : ''}</text>`;
  });
  s += `<text class="muted" x="${left}" y="18">◀ CPU (${esc(cn)}) faster</text><text class="muted" x="${W - right}" y="18" text-anchor="end">GPU (${esc(gn)}) faster ▶</text></svg>`;
  const notes = [];
  if (rows.some(r => r.earlier)) notes.push('Paler bars use earlier-script results (averages of repeated runs, no 95% range).');
  if (rows.some(r => r.fallback)) notes.push('* Different problem sizes on the two machines: best result of each machine is compared (' + rows.filter(r => r.fallback).map(r => wname(r.w)).join(', ') + ').');
  if (P.notComp.length) notes.push('Not comparable (different units of measure): ' + P.notComp.join(', ') + '.');
  el.innerHTML = `<div class="chart">${s}</div>` + (notes.length ? `<ul class="notes">${notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : '') +
    `<h2>Table</h2><div class="tbl-wrap"><table><thead><tr><th>Workload</th><th>Compared at</th><th class="num">CPU</th><th class="num">GPU</th><th class="num">Times faster</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td><a href="#compare/${cpu}/${gpu}/${r.w}">${esc(wname(r.w))}</a></td><td>${esc(r.fallback ? 'best of each machine' : r.a.label)}</td><td class="num">${esc(fmtU(r.a.v, r.unit))}</td><td class="num">${esc(fmtU(r.b.v, r.unit))}</td><td class="num">${r.ratio >= 1 ? 'GPU' : 'CPU'} ${times(r.ratio)}</td></tr>`).join('')}
    <tr><td><b>Overall (geometric mean)</b></td><td></td><td></td><td></td><td class="num"><b>${gm >= 1 ? 'GPU' : 'CPU'} ${times(gm)}</b></td></tr></tbody></table></div>`;
  el.querySelectorAll('rect.bar').forEach(b => {
    const r = all[+b.dataset.i];
    b.onmousemove = e => showTip(e, r.gm ? `<b>Overall</b><br>${r.ratio >= 1 ? 'GPU' : 'CPU'} ${times(r.ratio)} faster on average` :
      `<b>${esc(r.label)}</b><br>${esc(r.fallback ? 'best result of each machine' : 'at ' + r.a.label)}<br>CPU: ${esc(fmtU(r.a.v, r.unit))}<br>GPU: ${esc(fmtU(r.b.v, r.unit))}<br>${r.ratio >= 1 ? 'GPU' : 'CPU'} ${times(r.ratio)} faster${r.ci ? ` (95% range ${fmt(r.ci[0])}–${fmt(r.ci[1])}×)` : ''}`);
    b.onmouseleave = hideTip;
    if (!r.gm) { b.style.cursor = 'pointer'; b.onclick = () => go(`compare/${cpu}/${gpu}/${r.w}`); }
  });
}
function drawOne(el, r, cn, gn, cpu, gpu) {
  const A = C.data[cpu][r.w], B = C.data[gpu][r.w];
  const kb = new Map(B.pts.map(p => [p.key, p]));
  let common = A.pts.filter(p => kb.has(p.key)).sort((x, y) => (x.prec > y.prec ? 1 : x.prec < y.prec ? -1 : 0) || (x.sz - y.sz));
  const pts = common.length ? common.map(a => ({ label: a.label, a, b: kb.get(a.key), ratio: kb.get(a.key).v / a.v, ci: ciFor(cpu, gpu, r.w, a.key) }))
                            : [{ label: 'best result of each machine', a: r.a, b: r.b, ratio: r.ratio, ci: null }];
  // chart 1: both machines' results per size
  const W = 1000, H = 380, L = 80, R = 20, T = 20, Bm = 120, n = pts.length;
  const vals = pts.flatMap(p => [p.a.v, p.b.v]).filter(v => v > 0);
  const lo = Math.min(...vals) / 1.5, hi = Math.max(...vals) * 1.5, y = v => T + (1 - (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo))) * (H - T - Bm);
  const xs = i => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1));
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  const dec = []; for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++) dec.push(10 ** e);
  dec.filter(t => t >= lo && t <= hi).forEach(t => s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="#262626"/><text class="muted" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`);
  s += `<text class="muted" transform="translate(16,${(H - Bm) / 2}) rotate(-90)" text-anchor="middle">${esc(r.unit)} (log scale)</text>`;
  for (const [key, col, name] of [['a', 'var(--cpu)', cn], ['b', 'var(--gpu)', gn]]) {
    const op = mach(key === 'a' ? cpu : gpu).category === 'earlier' ? 0.55 : 1;
    if (n > 1) s += `<polyline fill="none" stroke="${col}" stroke-width="2" opacity="${op}" points="${pts.map((p, i) => `${xs(i)},${y(p[key].v)}`).join(' ')}"/>`;
    pts.forEach((p, i) => s += `<circle cx="${xs(i)}" cy="${y(p[key].v)}" r="5" fill="${col}" opacity="${op}" stroke="#000" stroke-width="2" class="pt" data-i="${i}"/>`);
  }
  pts.forEach((p, i) => s += `<text class="muted" transform="translate(${xs(i)},${H - Bm + 14}) rotate(35)" font-size="11">${esc(p.label)}</text>`);
  s += `</svg>`;
  // chart 2: times faster per size
  const H2 = 300, B2 = 120, rv = pts.flatMap(p => [p.ratio, ...(p.ci || [])]);
  const lo2 = Math.min(0.5, ...rv) / 1.3, hi2 = Math.max(2, ...rv) * 1.3, y2 = v => T + (1 - (Math.log10(v) - Math.log10(lo2)) / (Math.log10(hi2) - Math.log10(lo2))) * (H2 - T - B2);
  const bw = Math.min(46, (W - L - R) / n * 0.6), xb = i => L + (i + 0.5) * (W - L - R) / n;
  let s2 = `<svg viewBox="0 0 ${W} ${H2}">`;
  [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200].filter(t => t >= lo2 && t <= hi2).forEach(t => s2 += `<line x1="${L}" x2="${W - R}" y1="${y2(t)}" y2="${y2(t)}" stroke="${t === 1 ? '#f5f5f5' : '#262626'}" ${t === 1 ? 'stroke-dasharray="4 3"' : ''}/><text class="muted" x="${L - 8}" y="${y2(t) + 4}" text-anchor="end">${t === 1 ? 'equal' : (t > 1 ? `GPU ${t}×` : `CPU ${fmt(1 / t)}×`)}</text>`);
  pts.forEach((p, i) => { const g = p.ratio >= 1, ya = y2(Math.max(p.ratio, 1)), yb = y2(Math.min(p.ratio, 1));
    s2 += `<rect x="${xb(i) - bw / 2}" y="${ya}" width="${bw}" height="${Math.max(2, yb - ya)}" fill="${g ? 'var(--gpu)' : 'var(--cpu)'}" opacity="${r.earlier ? 0.55 : 1}" rx="2" class="pt2" data-i="${i}"/>`;
    if (p.ci) s2 += `<line x1="${xb(i)}" x2="${xb(i)}" y1="${y2(p.ci[1])}" y2="${y2(p.ci[0])}" stroke="#f5f5f5" stroke-width="1.5"/>`;
    s2 += `<text x="${xb(i)}" y="${(g ? ya : yb + 14) - (g ? 6 : 0)}" text-anchor="middle" font-size="11" font-weight="600">${times(p.ratio)}</text>`;
    s2 += `<text class="muted" transform="translate(${xb(i) - 4},${H2 - B2 + 14}) rotate(35)" font-size="11">${esc(p.label)}</text>`; });
  s2 += `</svg>`;
  const notes = [];
  if (r.earlier) notes.push('Paler marks use earlier-script results (averages of repeated runs, no 95% range).');
  if (!common.length) notes.push('The two machines ran different problem sizes, so the best result of each machine is compared.');
  el.innerHTML = `<div class="chart"><h3>${esc(wname(r.w))}: results on both machines</h3>
    <div class="legend"><span><b style="color:var(--cpu)">●</b>CPU: ${esc(cn)}</span><span><b style="color:var(--gpu)">●</b>GPU: ${esc(gn)}</span></div>${s}</div>
    <div class="chart"><h3>Times faster at each size</h3>${s2}</div>` + (notes.length ? `<ul class="notes">${notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : '') +
    `<h2>Table</h2><div class="tbl-wrap"><table><thead><tr><th>Size</th><th class="num">CPU</th><th class="num">GPU</th><th class="num">Times faster</th></tr></thead><tbody>
    ${pts.map(p => `<tr><td>${esc(p.label)}</td><td class="num">${esc(fmtU(p.a.v, r.unit))}</td><td class="num">${esc(fmtU(p.b.v, r.unit))}</td><td class="num">${p.ratio >= 1 ? 'GPU' : 'CPU'} ${times(p.ratio)}${p.ci ? ` <span style="color:var(--muted)">(${fmt(p.ci[0])}–${fmt(p.ci[1])})</span>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
  el.querySelectorAll('.pt, .pt2').forEach(c => { const p = pts[+c.dataset.i];
    c.onmousemove = e => showTip(e, `<b>${esc(p.label)}</b><br>CPU: ${esc(fmtU(p.a.v, r.unit))}<br>GPU: ${esc(fmtU(p.b.v, r.unit))}<br>${p.ratio >= 1 ? 'GPU' : 'CPU'} ${times(p.ratio)} faster`);
    c.onmouseleave = hideTip; });
}

// ── library analysis ────────────────────────────────────────────────────────
let libOpen = null, libAll = false;
function viewLibrary() {
  const R = libraryReport, summ = R.summary || [], order = R.order || [];
  const devs = [...new Set(summ.map(r => r.device))].sort((a, b) => (pages[a]?.cls || '').localeCompare(pages[b]?.cls || '') || a.localeCompare(b));
  const keys = [...new Map(summ.map(r => [r.workload_id + '|' + r.precision, r])).values()]
    .sort((a, b) => (order.indexOf(a.workload_id) - order.indexOf(b.workload_id)) || a.precision.localeCompare(b.precision));
  const used = new Set(summ.map(r => r.library));
  const wn = w => (C.workload_names || {})[w] || w;
  let h = `<h1>Library analysis</h1><p class="lead">Some workloads can run on several software libraries. We time all of them on the same inputs
    on each machine and keep the fastest for the results. Each cell shows the fastest library, how many sizes it won, and how fast the others were in comparison.
    Click a cell for the numbers.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Workload</th>${devs.map(d => `<th>${esc(pages[d]?.name || d)}</th>`).join('')}</tr></thead><tbody>`;
  for (const k of keys) {
    h += `<tr><td>${esc(wn(k.workload_id))} <span class="tag">${esc(k.precision)}</span></td>`;
    for (const dev of devs) {
      const g = summ.filter(r => r.device === dev && r.workload_id === k.workload_id && r.precision === k.precision)
        .sort((a, b) => (b.wins - a.wins) || (b.median_speed_vs_winner - a.median_speed_vs_winner));
      if (!g.length) { h += '<td style="color:var(--muted)">—</td>'; continue; }
      const id = `${dev}|${k.workload_id}|${k.precision}`, w = g[0];
      h += `<td class="lib${libOpen === id ? ' open' : ''}" data-cell="${esc(id)}"><div class="w">Fastest: ${esc(libName(w.library))}</div>
        <div class="o">won ${w.wins} of ${w.problems} sizes</div>
        ${g.slice(1).map(o => `<div class="o">${esc(libName(o.library))}: ${Math.round(100 * o.median_speed_vs_winner)}% as fast</div>`).join('')}</td>`;
    }
    h += '</tr>';
  }
  h += '</tbody></table></div>';
  if (libOpen) {
    const [dev, wid, prec] = libOpen.split('|');
    const g = summ.filter(r => r.device === dev && r.workload_id === wid && r.precision === prec).sort((a, b) => b.best_metric - a.best_metric);
    h += `<div class="box" style="margin-top:18px"><h3>${esc(wn(wid))} on ${esc(pages[dev]?.name || dev)}</h3>
      <div class="tbl-wrap"><table><thead><tr><th>Library</th><th class="num">Best result</th><th class="num">Share of the machine's limit</th></tr></thead><tbody>
      ${g.map(r => `<tr><td>${esc(libName(r.library))}</td><td class="num">${esc(fmtU(r.best_metric, r.metric_name))}</td><td class="num">${r.best_pct_measured_peak == null ? '—' : Math.round(r.best_pct_measured_peak) + '%'}</td></tr>`).join('')}</tbody></table></div>
      <button class="lnk" id="lib-all">${libAll ? 'Hide' : 'Show'} every size</button>`;
    if (libAll) {
      const probs = (R.problems || []).filter(p => p.device === dev && p.workload_id === wid && p.precision === prec);
      const libs = [...new Set(probs.flatMap(p => Object.keys(p).filter(c => c.startsWith('metric[') && p[c] != null).map(c => c.slice(7, -1))))];
      const pt = s => { try { return Object.entries(JSON.parse(s)).filter(([k]) => !['variant', 'precision', '_env'].includes(k)).map(([k, v]) => `${k} ${v}`).join(', '); } catch (e) { return s; } };
      h += `<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Size</th>${libs.map(l => `<th class="num">${esc(libName(l))}</th>`).join('')}</tr></thead><tbody>
        ${probs.map(p => `<tr><td class="mono" style="font-size:12px">${esc(pt(p.problem))}</td>${libs.map(l => `<td class="num">${p['metric[' + l + ']'] == null ? '—' : esc(fmt(p['metric[' + l + ']']))}${p.winner === l ? ' <span style="color:var(--accent)">●</span>' : ''}</td>`).join('')}</tr>`).join('')}
        </tbody></table></div><p class="note">Values in ${esc(g[0]?.metric_name || '')}; ● marks the fastest at that size.</p>`;
    }
    h += '</div>';
  }
  const notes = (R.notes || []).filter(n => n.plain && n.status === 'verified' && (n.library === '*' || used.has(n.library)));
  if (notes.length) h += `<h2>Why the winner wins</h2><ul class="notes">${notes.map(n => `<li><b style="color:var(--text)">${esc(wn(n.workload))}</b>: ${esc(n.plain)}</li>`).join('')}</ul>`;
  h += `<h2>The libraries</h2><div class="box gloss">${Object.entries(GLOSS).filter(([k]) => used.has(k)).map(([k, [n, lic, d]]) => `<div><b>${esc(n)}</b> <span>(${esc(lic)})</span><br><span>${esc(d)}</span></div>`).join('')}</div>`;
  if ((R.variants || []).length) h += `<p class="note">Not shown above: on/off switches that are not library choices (e.g. processor encryption instructions turned off, or a faster approximate exponential on the GPU); they appear on the workload pages.</p>`;
  return h;
}
function bindLibrary() {
  document.querySelectorAll('td.lib').forEach(td => td.onclick = () => { libOpen = libOpen === td.dataset.cell ? null : td.dataset.cell; libAll = false; render(); });
  const b = document.getElementById('lib-all'); if (b) b.onclick = () => { libAll = !libAll; render(); };
}

// ── todo ────────────────────────────────────────────────────────────────────
function viewTodo() {
  return `<h1>Todo</h1><p class="lead">What remains before the final paper.</p>` +
    (todoData.groups || []).map(g => `<div class="todo-g"><h2>${esc(g.group)}</h2><ul>${g.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('');
}

render();
</script>
