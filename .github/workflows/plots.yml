name: Regenerate plots

on:
  push:
    branches: [main]
    paths:
      - 'results/data/**.csv'
      - 'results/generate_plots.py'
      - 'results/generate_gemv_plots.py'
      - 'results/generate_saxpy_plots.py'
      - 'results/generate_spgemm_plots.py'
      - 'results/generate_index.py'
      - 'results/index.html'
      - 'Makefile'
      - 'results/gpu_specs.py'
      - 'requirements.txt'
  workflow_dispatch: {}

jobs:
  plots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Generate Plots or UI
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -qE '\.csv|results/generate_.*_plots\.py|gpu_specs\.py|requirements\.txt|Makefile'; then
            echo "Data or scripts changed. Running full plot generation..."
            make plots
          else
            echo "Only UI changed. Regenerating index.html..."
            make venv
            .venv/bin/python results/generate_index.py
          fi

      - name: Publish to plots branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: results/plots
          publish_branch: plots
          keep_files: true
