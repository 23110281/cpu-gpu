name: Regenerate plots

on:
  push:
    branches: [main]
    paths:
      - 'results/data/**.csv'
      - 'results/plotting/**.py'
      - 'results/generate_index.py'
      - 'results/index.html'
      - 'results/workloads.json'
      - 'Makefile'
      - 'requirements.txt'
      - '.github/workflows/plots.yml'
  workflow_dispatch: {}

jobs:
  plots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout existing plots
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: plots
          path: results/plots

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Generate Plots or UI
        run: |
          # Remove .git from the checked-out plots folder to prevent deployment conflicts
          rm -rf results/plots/.git
          
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -qE '\.csv|results/plotting/.*\.py|requirements\.txt|Makefile'; then
            echo "Data or scripts changed. Running full plot generation..."
            make plots
          else
            echo "Only UI / workload status changed. Regenerating index.html..."
            make venv
            .venv/bin/python results/generate_index.py
          fi

      - name: Publish to plots branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: results/plots
          publish_branch: plots
          keep_files: true
